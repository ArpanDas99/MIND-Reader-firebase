<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mind Reader</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
      background-color: #f0f8ff;
    }
    input[type="number"] {
      padding: 10px;
      font-size: 18px;
      width: 100px;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      margin-top: 20px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
    }
    #result {
      margin-top: 30px;
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }
    #loading {
      font-size: 20px;
      color: #888;
      display: none;
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <h1>Think of a Number (1 to 10)</h1>
  <p>Type your number below, but don't worry... I'll read your mind!</p>

  <input type="number" id="numberInput" min="1" max="10" placeholder="1-10">
  <br>
  <button onclick="readMind()">Read My Mind</button>

  <div id="loading">Reading your mind...</div>
  <div id="result"></div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyB8sKFQ-vy_voU0UhsJN640s_kGWLuG-1o",
      authDomain: "mindreader-af577.firebaseapp.com",
      databaseURL: "https://mindreader-af577-default-rtdb.firebaseio.com",
      projectId: "mindreader-af577",
      storageBucket: "mindreader-af577.appspot.com",
      messagingSenderId: "217099094171",
      appId: "1:217099094171:web:d6a60f77d4636ee0cb1e3e",
      measurementId: "G-38R0TYLKWE"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // Function to store and display the number
    window.readMind = function () {
      const number = document.getElementById("numberInput").value;
      const loading = document.getElementById("loading");
      const result = document.getElementById("result");

      result.innerText = "";
      if (number >= 1 && number <= 10) {
        loading.style.display = "block";

        // Save to Firebase
        const numbersRef = ref(database, 'mindReads');
        const newEntry = push(numbersRef);
        set(newEntry, {
          number: Number(number),
          timestamp: new Date().toISOString()
        });

        // Simulate mind reading
        setTimeout(() => {
          loading.style.display = "none";
          result.innerText = `You're thinking of... ${number}!`;
        }, 2500);
      } else {
        result.innerText = "Please enter a number between 1 and 10.";
        loading.style.display = "none";
      }
    }
  </script>
</body>
</html>
